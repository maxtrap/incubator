#cloud-config
write_files:
  - path: /etc/sysctl.d/99-router.conf
    content: |
      net.ipv4.ip_forward = 1
  - path: /etc/nftables.conf
    content: |
      #!/usr/sbin/nft -f
      flush ruleset
      table ip nat {
        chain postrouting {
          type nat hook postrouting priority srcnat; policy accept;
          oifname "enp7s0" masquerade
        }
      }
runcmd:
  - sysctl --system
  - systemctl enable --now nftables
